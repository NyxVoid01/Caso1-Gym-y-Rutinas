
{% extends "base.html" %}
{% block title %}Ingresar · Gimnasio del Barrio{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Ingresar</h1>
      {% if form.non_field_errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <form method="post" class="form-bonito">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-dark w-100">Ingresar</button>
      </form>
      <p class="mt-3 mb-0 small">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
    </div></div>
  </div></div>
{% endblock %}
