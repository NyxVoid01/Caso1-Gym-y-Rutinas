
{% extends "base.html" %}
{% block title %}Crear cuenta · Gimnasio del Barrio{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Crear cuenta</h1>
      <form method="post" class="form-bonito" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-dark w-100">Registrarme</button>
      </form>
      <p class="mt-3 mb-0 small">¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa aquí</a></p>
    </div></div>
  </div></div>
{% endblock %}
