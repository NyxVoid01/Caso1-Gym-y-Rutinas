
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gimnasio del Barrio{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">🏋️ Gimnasio del Barrio</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Inicio</a></li>
        {# En los próximos pasos agregamos: Rutinas, Ingresar, Registrarse, Mi cuenta... #}
        <li class="nav-item"><a class="nav-link" href="{% url 'lista_rutinas' %}">Rutinas</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-4">Gimnasio del Barrio · MVP Django</footer>
</body>
</html>
