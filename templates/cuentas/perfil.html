
{% extends "base.html" %}
{% block title %}Editar mis datos · Gimnasio del Barrio{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Editar mis datos</h1>
      <form method="post" class="form-bonito" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-dark">Guardar cambios</button>
        <a href="{% url 'cuenta' %}" class="btn btn-link">Cancelar</a>
      </form>
    </div></div>
  </div></div>
{% endblock %}
